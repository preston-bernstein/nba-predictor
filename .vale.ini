# Vale config for the writing pack. The House styles come from the pack and sit unchanged in scripts/vendor/vale/styles.
# Only `error` rules fail the gate. Warnings print and pass.
StylesPath = scripts/vendor/vale/styles
MinAlertLevel = warning
IgnoredScopes = code, tt

[*.md]
BasedOnStyles = House, HouseDocs, Google, write-good
Google.Latin = warning

[*.{py,js,jsx,ts,tsx,go,java,rs,rb,c,h,cc,cpp,css,swift}]
BasedOnStyles = House, HouseNotes
