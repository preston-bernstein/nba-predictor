name: pre-commit

on:
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"

  workflow_dispatch:
concurrency:
  group: precommit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Load fleet-logging deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.FLEET_LOGGING_DEPLOY_KEY }}
      - run: python -m pip install -U pip pre-commit
      - name: Install project with dev extras (the pytest hook runs in this environment)
        run: |
          if [ -f constraints.txt ]; then
            pip install -e '.[dev]' -c constraints.txt
          else
            pip install -e '.[dev]'
          fi
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure --color always
