name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"  # match pyproject requires-python
  COV_MIN: "95"
  DIFF_COV_MIN: "90"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Load fleet-logging deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.FLEET_LOGGING_DEPLOY_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # If constraints.txt exists, use it to avoid resolver drift
          if [ -f constraints.txt ]; then
            pip install -e '.[dev]' --upgrade-strategy eager -c constraints.txt
          else
            pip install -e '.[dev]' --upgrade-strategy eager
          fi
          python -m pip install diff-cover pytest-html pytest-xdist build

      - name: Lint
        run: make lint

      - name: Build package
        run: python -m build

      - name: Test with coverage gate (offline fixtures)
        run: |
          mkdir -p report
          OFFLINE=1 COV_MIN=${{ env.COV_MIN }} make test-cov-gate

      - name: Diff coverage gate (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under="${DIFF_COV_MIN}"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: true

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage_html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: report
