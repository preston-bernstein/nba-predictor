name: Workflow lint

# This repo keeps its own CI workflow rather than calling the shared one: its
# jobs carry repo-specific logic that a generic caller would drop. It still
# gets the shared linter, so the workflow file itself is held to the same
# standard as every other repo's.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**', '.github/dependabot.yml']
  pull_request:
    paths: ['.github/workflows/**', '.github/actions/**', '.github/dependabot.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@980585f4e9c3c1ef982cb934e153f925121fe0c0 # v1

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python tools
        run: python -m pip install --require-hashes -r scripts/gate-tools/requirements.txt
      - name: Run the GitHub Actions gate
        run: bash scripts/gha-validate.sh
